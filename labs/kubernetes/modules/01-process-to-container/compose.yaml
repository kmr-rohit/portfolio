services:
  redis:
    image: redis:8.4.0-alpine@sha256:4eec4565e45aa0b3966554c866bc73211e281b0b3d89fe9a33c982e6faca809d
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --protected-mode
      - "no"
      - --bind
      - 0.0.0.0
      - --dir
      - /tmp
    user: "999:1000"
    working_dir: /tmp
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s
    cpus: 0.50
    mem_limit: 128m
    pids_limit: 100
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - workbench

  api:
    image: workbench-api:module-01
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_IMAGE: python:3.13.14-alpine3.23@sha256:9fdbf2e3e82628351513560b121e2ee6ce31cac212be9e070c5a5e2769fb5e76
    environment:
      WORKBENCH_BIND_HOST: 0.0.0.0
      WORKBENCH_PORT: "8080"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:18080:8080"
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).read()
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s
    stop_signal: SIGTERM
    stop_grace_period: 15s
    cpus: 0.50
    mem_limit: 128m
    pids_limit: 100
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - workbench

networks:
  workbench:
    driver: bridge
