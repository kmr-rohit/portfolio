<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="%sveltekit.assets%/p-favicon.png" />
		<link rel="alternate" type="application/rss+xml" title="Rohit Kumar" href="/rss.xml" />

		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#e6e9ed" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#060608" />

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,300..500;1,300..500&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&family=Geist+Mono:wght@300..600&display=swap"
		/>

		<script>
			// Applies the stored colour mode before first paint. Mirrors what
			// mode-watcher does on mount, which is too late to avoid a flash.
			(() => {
				try {
					const pref = JSON.parse(localStorage.getItem('userPrefersMode') || '"system"');
					const system = window.matchMedia('(prefers-color-scheme: dark)').matches
						? 'dark'
						: 'light';
					const mode = pref === 'system' || !pref ? system : pref;
					document.documentElement.classList.toggle('dark', mode === 'dark');
					document.documentElement.style.colorScheme = mode;
				} catch {
					// localStorage can throw in private mode; the default light theme is fine.
				}
			})();
		</script>

		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
