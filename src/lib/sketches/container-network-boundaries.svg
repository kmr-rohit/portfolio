<svg
  xmlns="http://www.w3.org/2000/svg"
  width="900"
  height="590"
  viewBox="0 0 900 590"
  role="img"
  aria-label="Healthy and broken Docker network paths. Healthy: a host request to 127.0.0.1 port 18080 crosses Docker Desktop published-port forwarding and a Docker bridge, reaches an API listening on 0.0.0.0 port 8080 through eth0, then reaches Redis by service name on port 6379. Broken: when the API listens only on its container-local 127.0.0.1 loopback, forwarded traffic reaches eth0 but no listener, even though an in-container loopback health check can succeed. API-to-Redis connectivity remains valid, but this host request stops before the app and never initiates that hop."
>
  <title>Why localhost works in one place and fails in another</title>
  <desc>
    The upper path works because the host-only published port forwards to an API
    listener on every container interface. The lower path fails because a
    listener on the API container's loopback interface cannot accept traffic
    arriving through its bridge-facing eth0 interface. Redis remains available
    on the bridge; this particular request never reaches the app that would use
    it.
  </desc>

  <defs>
    <marker id="network-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#1d1f22" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
    <marker id="network-arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#536ab5" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
  </defs>

  <style>
    text {
      fill: #1d1f22;
      font-family: 'Architects Daughter', 'Segoe Print', 'Comic Sans MS', cursive;
      font-weight: 700;
    }
    .small { font-size: 13px; }
    .note { font-size: 15px; }
    .label { font-size: 17px; }
    .heading { font-size: 21px; }
    .ink {
      fill: none;
      stroke: #1d1f22;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .blue-line {
      fill: none;
      stroke: #536ab5;
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .muted-line {
      fill: none;
      stroke: #8b8d90;
      stroke-width: 2;
      stroke-dasharray: 6 6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .bridge {
      fill: none;
      stroke: #6d68b7;
      stroke-width: 2.1;
      stroke-dasharray: 10 7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>

  <rect width="900" height="590" fill="#f7f5f0" />

  <text x="34" y="38" font-size="27">Why localhost works here — and fails there</text>
  <path d="M34 49 C200 46 366 52 530 48" stroke="#e0bd58" stroke-width="5" stroke-linecap="round" opacity="0.62" />
  <text x="866" y="37" font-size="14" text-anchor="end" fill="#5d6065">MODULE 01 · NETWORK PATH</text>
  <text x="34" y="68" class="small" fill="#65676b">Docker forwards the Mac's port · the app chooses which container addresses accept traffic</text>

  <!-- Healthy path. The enclosing panel and check mark duplicate the green color cue. -->
  <path d="M24 91 Q226 86 430 91 T876 89 L878 300 Q663 304 451 300 T22 303 Q27 196 24 91 Z" fill="#eef4ec" stroke="#54765b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M42 109 L50 118 L66 99" fill="none" stroke="#477351" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
  <text x="76" y="116" class="heading" fill="#3f6848">HEALTHY · app listens on every container address</text>

  <path d="M46 151 Q116 147 191 151 L189 231 Q117 235 47 230 Z" fill="#f6e9b7" class="ink" />
  <text x="118" y="174" class="label" text-anchor="middle">macOS client</text>
  <text x="118" y="198" class="note" text-anchor="middle">curl → 127.0.0.1</text>
  <text x="118" y="219" class="note" text-anchor="middle">host port 18080</text>

  <path d="M221 143 Q540 137 852 143 L855 263 Q540 267 220 263 Z" class="bridge" />
  <text x="241" y="163" class="small" fill="#534e9d">private Docker network · “redis” is the service name</text>

  <path d="M190 190 C211 188 218 188 242 188" class="blue-line" marker-end="url(#network-arrow-blue)" />
  <path d="M242 171 L242 211" stroke="#536ab5" stroke-width="2.3" stroke-linecap="round" />
  <text x="214" y="137" class="small" text-anchor="middle" fill="#4c62ad">Docker Desktop forwards port 18080</text>

  <path d="M270 174 Q389 169 503 174 L506 244 Q390 248 271 243 Z" fill="#dfe9f5" class="ink" />
  <text x="289" y="197" class="label">API container</text>
  <text x="289" y="219" class="note" fill="#3f6848">listens on 0.0.0.0:8080</text>
  <path d="M455 189 C469 187 482 187 495 190" stroke="#477351" stroke-width="2.5" stroke-linecap="round" />
  <text x="289" y="239" class="small">accepts network + local traffic ✓</text>

  <path d="M506 207 C547 207 573 207 613 207" class="blue-line" marker-end="url(#network-arrow-blue)" />
  <text x="560" y="195" class="small" text-anchor="middle" fill="#4c62ad">redis:6379</text>

  <path d="M622 174 Q718 170 814 174 L812 244 Q717 248 622 243 Z" fill="#dcebdc" class="ink" />
  <text x="718" y="199" class="label" text-anchor="middle">Redis container</text>
  <text x="718" y="221" class="note" text-anchor="middle">private port 6379</text>
  <text x="718" y="239" class="small" text-anchor="middle">not published to host</text>

  <text x="449" y="286" class="note" text-anchor="middle" fill="#3f6848">request enters API → service name “redis” finds the other container</text>

  <!-- Broken path. X marks and labels carry the meaning without relying on color. -->
  <path d="M23 327 Q226 322 430 327 T876 325 L879 557 Q665 561 452 557 T22 560 Q26 443 23 327 Z" fill="#ececea" stroke="#7b7d80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M43 341 L62 360 M62 341 L43 360" fill="none" stroke="#a54b45" stroke-width="3.2" stroke-linecap="round" />
  <text x="76" y="355" class="heading" fill="#8f403b">BROKEN · app listens only to itself</text>

  <path d="M46 394 Q116 390 191 394 L189 474 Q117 478 47 473 Z" fill="#f6e9b7" class="ink" />
  <text x="118" y="417" class="label" text-anchor="middle">macOS client</text>
  <text x="118" y="441" class="note" text-anchor="middle">curl → 127.0.0.1</text>
  <text x="118" y="462" class="note" text-anchor="middle">host port 18080</text>

  <path d="M221 386 Q540 380 852 386 L855 506 Q540 510 220 506 Z" class="bridge" />
  <text x="241" y="406" class="small" fill="#534e9d">same network · same forwarded port · only the listening address changed</text>

  <path d="M190 433 C211 431 218 431 242 431" class="blue-line" marker-end="url(#network-arrow-blue)" />
  <path d="M242 414 L242 454" stroke="#536ab5" stroke-width="2.3" stroke-linecap="round" />
  <text x="215" y="489" class="small" text-anchor="middle" fill="#4c62ad">Docker still forwards</text>

  <path d="M310 417 Q425 412 539 417 L541 487 Q425 491 311 486 Z" fill="#dfe9f5" class="ink" />
  <text x="329" y="440" class="label">API container</text>
  <text x="329" y="465" class="note" fill="#8f403b">listens on 127.0.0.1:8080</text>
  <circle cx="501" cy="439" r="17" fill="#f0dcda" stroke="#a54b45" stroke-width="1.7" stroke-dasharray="4 4" />
  <text x="501" y="444" class="small" text-anchor="middle">inside only ✓</text>
  <text x="528" y="482" class="small" text-anchor="end">network: no listener</text>

  <!-- Traffic reaches eth0 and stops; an explicit stop symbol avoids a color-only distinction. -->
  <path d="M242 431 C259 431 272 431 294 431" class="blue-line" marker-end="url(#network-arrow-blue)" />
  <path d="M285 422 L302 439 M302 422 L285 439" fill="none" stroke="#a54b45" stroke-width="3.4" stroke-linecap="round" />
  <text x="293" y="462" class="small" text-anchor="middle" fill="#8f403b">STOP</text>

  <path d="M541 450 C580 450 606 450 642 450" class="blue-line" marker-end="url(#network-arrow-blue)" />
  <text x="592" y="500" class="small" text-anchor="middle" fill="#4c62ad">API → Redis still works</text>

  <path d="M650 417 Q733 413 815 417 L813 487 Q733 491 650 486 Z" fill="#dcebdc" class="ink" />
  <text x="733" y="442" class="label" text-anchor="middle">Redis container</text>
  <text x="733" y="463" class="small" text-anchor="middle" fill="#3f6848">still reachable by name</text>
  <text x="733" y="480" class="small" text-anchor="middle">redis:6379</text>

  <g transform="rotate(-1 570 531)">
    <path d="M302 515 Q570 510 838 515 L836 548 Q570 552 303 548 Z" fill="#f6e9b7" stroke="#c59e31" stroke-width="1.5" />
    <text x="570" y="537" class="note" text-anchor="middle">
      host request stops here · an inside-only health check may still pass
    </text>
  </g>

  <text x="35" y="579" class="small" fill="#65676b">127.0.0.1 means “only inside this host or container” · Mac localhost and container localhost are different places</text>
</svg>
